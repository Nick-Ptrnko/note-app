<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mind cards log</title>
    <style>
        /* Базові стилі для мобільних: на всю ширину вікна */
        body { 
            font-family: sans-serif; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px 15px; 
            background: #f4f6f9; 
            color: #333; 
        }

        /* Для ноутбуків та планшетів додаємо гарні відступи (класні поля) */
        @media (min-width: 768px) {
            body {
                margin: 40px auto;
                padding: 0 20px;
            }
        }

        h1 { font-size: 24px; margin-bottom: 20px; color: #222; }
        .create-link { display: inline-block; margin-bottom: 25px; color: #007bff; text-decoration: none; font-weight: bold; font-size: 16px; }
        .create-link:hover { text-decoration: underline; }
        .date-group { margin-bottom: 25px; }
        .date-header { font-size: 14px; font-weight: bold; color: #666; border-bottom: 2px solid #ddd; padding-bottom: 4px; margin-bottom: 10px; }
        ul { list-style-type: none; padding-left: 0; margin: 0; }
        li { margin-bottom: 8px; }
        li a { color: #007bff; text-decoration: none; font-size: 16px; }
        li a:hover { text-decoration: underline; }
        .empty { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h1>--- mind cards log ---</h1>

    <div>
        <a href="/create" class="create-link">+ Створити</a>
    </div>

    {% if grouped_notes %}
        {% for date, day_notes in grouped_notes %}
            <div class="date-group">
                <div class="date-header">{{ date }}</div>
                <ul>
                    {% for note in day_notes %}
                        <li>
                            <a href="/note/{{ note.id }}">{{ note.title }}</a>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endfor %}
    {% else %}
        <p class="empty">Поки немає жодного запису.</p>
    {% endif %}

</body>
</html>
